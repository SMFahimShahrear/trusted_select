<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales | Trusted Select</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="sales-body">
    <div class="layout">
        <header class="header"></header>
        <nav class="sidenav"></nav>

        <main class="main">
            <!-- Add sale -->
            <section class="card">
                <div class="card-head">
                    <h2>New sale</h2>
                </div>

                <form id="add-sale-form" class="form-grid">
                    <div class="form-field">
                        <label for="sale-date">Date</label>
                        <input type="date" id="sale-date" name="date" required>
                    </div>

                    <div class="form-field">
                        <label for="memo-no">Memo No</label>
                        <input type="text" id="memo-no" name="memoNo" placeholder="Blank = next number">
                    </div>

                    <div class="form-field">
                        <label for="customer-name">Customer Name</label>
                        <input type="text" id="customer-name" name="customerName" placeholder="Full name"
                            autocomplete="off" required>
                    </div>

                    <div class="form-field">
                        <label for="customer-phone">Phone Number</label>
                        <input type="tel" id="customer-phone" name="customerPhone" placeholder="01XXXXXXXXX"
                            inputmode="numeric" pattern="01[0-9]{9}" title="11-digit number starting with 01"
                            autocomplete="off">
                    </div>

                    <div class="form-field full">
                        <label for="customer-address">Address</label>
                        <textarea id="customer-address" name="customerAddress" rows="2" placeholder="Optional"
                            autocomplete="off"></textarea>
                    </div>

                    <!-- Items sold -->
                    <div class="form-field full">
                        <span class="field-label">Items</span>
                        <div class="items-box">
                            <div class="table-wrap" style="border: 0; border-radius: 0;">
                                <table class="items-table">
                                    <thead>
                                        <tr>
                                            <th>Product</th>
                                            <th>Qty</th>
                                            <th>Unit Price (Tk)</th>
                                            <th>Line Total</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="sale-items-body"></tbody>
                                </table>
                            </div>
                            <div class="items-foot">
                                <button type="button" class="btn btn-ghost btn-sm add-item-btn">+ Add another item</button>
                                <span class="muted items-subtotal"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="discount">Discount (Tk)</label>
                        <input type="number" id="discount" name="discount" min="0" step="0.01" value="0">
                    </div>

                    <div class="form-field">
                        <label for="payment">Payment</label>
                        <select id="payment" name="payment" required></select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary add-sale-btn">Save sale</button>
                        <p class="sale-total">Total: <strong id="sale-total">Tk 0</strong></p>
                        <p id="form-message" class="form-message" role="status"></p>
                    </div>
                </form>
            </section>

            <!-- Sales list -->
            <section class="card">
                <div class="card-head">
                    <h2>Sales</h2>
                    <div class="card-head-tools">
                        <div id="sales-range"></div>
                        <input type="search" id="sales-search" placeholder="Search customer, phone, memo">
                    </div>
                </div>

                <div class="summary-row" id="sales-summary"></div>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Memo</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Payment</th>
                                <th class="num">Net Sale</th>
                                <th class="num">Profit</th>
                                <th class="actions"></th>
                            </tr>
                        </thead>
                        <tbody id="sales-table-body">
                            <tr><td class="empty" colspan="8">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="footer"></footer>
    </div>

    <script type="module" src="./js/sales.js"></script>
</body>

</html>
