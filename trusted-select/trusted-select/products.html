<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Trusted Select</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="products-body">
    <div class="layout">
        <header class="header"></header>
        <nav class="sidenav"></nav>

        <main class="main">
            <!-- Add / edit product -->
            <section class="card">
                <div class="card-head">
                    <h2 id="product-form-title">Add product</h2>
                    <button type="button" class="btn btn-ghost btn-sm cancel-edit-btn" hidden>Cancel edit</button>
                </div>

                <form id="add-product-form" class="form-grid">
                    <div class="form-field">
                        <label for="item-code">Item Code</label>
                        <input type="text" id="item-code" name="itemCode" placeholder="Leave blank to auto-create">
                    </div>

                    <div class="form-field span-2">
                        <label for="item-name">Item Name</label>
                        <input type="text" id="item-name" name="name" placeholder="e.g. Cotton T-Shirt (M)" required>
                    </div>

                    <div class="form-field">
                        <label for="category">Category</label>
                        <select id="category" name="category" required></select>
                    </div>

                    <div class="form-field">
                        <label for="unit">Unit</label>
                        <select id="unit" name="unit" required></select>
                    </div>

                    <div class="form-field">
                        <label for="cost-price">Cost Price (Tk)</label>
                        <input type="number" id="cost-price" name="costPrice" min="0" step="0.01" required>
                    </div>

                    <div class="form-field">
                        <label for="selling-price">Selling Price (Tk)</label>
                        <input type="number" id="selling-price" name="sellingPrice" min="0" step="0.01" required>
                    </div>

                    <div class="form-field">
                        <label for="opening-stock">Opening Stock</label>
                        <input type="number" id="opening-stock" name="openingStock" min="0" step="1" value="0" required>
                        <span class="hint opening-stock-hint" hidden>Use Purchases or Sales to change stock.</span>
                    </div>

                    <div class="form-field">
                        <label for="low-stock-alert">Low Stock Alert at</label>
                        <input type="number" id="low-stock-alert" name="lowStockAlert" min="0" step="1" value="5" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary product-submit-btn">Add product</button>
                        <button type="button" class="btn btn-danger delete-product-btn" hidden>Delete product</button>
                        <p id="form-message" class="form-message" role="status"></p>
                    </div>
                </form>
            </section>

            <!-- Product list -->
            <section class="card">
                <div class="card-head">
                    <h2>All products</h2>
                    <div class="card-head-tools">
                        <select id="status-filter" aria-label="Filter by status">
                            <option value="">All items</option>
                            <option value="In Stock">In stock</option>
                            <option value="LOW STOCK">Low stock</option>
                            <option value="OUT OF STOCK">Out of stock</option>
                        </select>
                        <input type="search" id="product-search" placeholder="Search name, code or category">
                    </div>
                </div>

                <div class="summary-row" id="product-summary"></div>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th class="num">Cost</th>
                                <th class="num">Selling</th>
                                <th class="num">Margin</th>
                                <th class="num">Stock</th>
                                <th class="num">Stock Value</th>
                                <th>Status</th>
                                <th class="actions"></th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body">
                            <tr><td class="empty" colspan="10">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="footer"></footer>
    </div>

    <script type="module" src="./js/products.js"></script>
</body>

</html>
