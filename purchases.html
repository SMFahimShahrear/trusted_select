<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ea6c0a'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
    <title>Purchases | Trusted Select</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="purchases-body">
    <div class="layout">
        <header class="header"></header>
        <nav class="sidenav"></nav>

        <main class="main">
            <!-- Add purchase -->
            <section class="card">
                <div class="card-head">
                    <h2>Record stock arriving</h2>
                </div>

                <form id="add-purchase-form" class="form-grid">
                    <div class="form-field">
                        <label for="purchase-date">Date</label>
                        <input type="date" id="purchase-date" name="date" required>
                    </div>

                    <div class="form-field span-2">
                        <label for="purchase-product">Product</label>
                        <select id="purchase-product" name="productId" required></select>
                    </div>

                    <div class="form-field">
                        <label for="purchase-qty">Quantity</label>
                        <input type="number" id="purchase-qty" name="qty" min="1" step="1" required>
                    </div>

                    <div class="form-field">
                        <label for="purchase-cost">Unit Cost (Tk)</label>
                        <input type="number" id="purchase-cost" name="unitCost" min="0" step="0.01" required>
                        <span class="hint">Filled from the product's cost price.</span>
                    </div>

                    <div class="form-field">
                        <label for="supplier">Supplier</label>
                        <input type="text" id="supplier" name="supplier" placeholder="Optional">
                    </div>

                    <div class="form-field span-2">
                        <label for="note">Note</label>
                        <input type="text" id="note" name="note" placeholder="Optional">
                    </div>

                    <div class="form-field full">
                        <label class="checkbox">
                            <input type="checkbox" id="update-cost" name="updateCost">
                            Also set this as the product's new cost price
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary purchase-submit-btn">Save purchase</button>
                        <span class="muted purchase-total"></span>
                        <p id="form-message" class="form-message" role="status"></p>
                    </div>
                </form>
            </section>

            <!-- Purchase list -->
            <section class="card">
                <div class="card-head">
                    <h2>Purchases</h2>
                    <div class="card-head-tools">
                        <div id="purchase-range"></div>
                    </div>
                </div>

                <div class="summary-row" id="purchase-summary"></div>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Product</th>
                                <th class="num">Qty</th>
                                <th class="num">Unit Cost</th>
                                <th class="num">Total</th>
                                <th>Supplier</th>
                                <th>Note</th>
                                <th class="actions"></th>
                            </tr>
                        </thead>
                        <tbody id="purchase-table-body">
                            <tr><td class="empty" colspan="8">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="footer"></footer>
    </div>

    <script type="module" src="./js/purchases.js"></script>
</body>

</html>
