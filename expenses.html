<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ea6c0a'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
    <title>Expenses | Trusted Select</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="expenses-body">
    <div class="layout">
        <header class="header"></header>
        <nav class="sidenav"></nav>

        <main class="main">
            <!-- Add expense -->
            <section class="card">
                <div class="card-head">
                    <h2>Add expense</h2>
                </div>

                <form id="add-expense-form" class="form-grid">
                    <div class="form-field">
                        <label for="expense-date">Date</label>
                        <input type="date" id="expense-date" name="date" required>
                    </div>

                    <div class="form-field">
                        <label for="expense-category">Category</label>
                        <select id="expense-category" name="category" required></select>
                    </div>

                    <div class="form-field span-2">
                        <label for="expense-details">Details</label>
                        <input type="text" id="expense-details" name="details" placeholder="e.g. Poly bags & tape">
                    </div>

                    <div class="form-field">
                        <label for="expense-amount">Amount (Tk)</label>
                        <input type="number" id="expense-amount" name="amount" min="0.01" step="0.01" required>
                    </div>

                    <div class="form-field">
                        <label for="expense-paid-by">Paid By</label>
                        <select id="expense-paid-by" name="paidBy" required></select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary expense-submit-btn">Save expense</button>
                        <p id="form-message" class="form-message" role="status"></p>
                    </div>
                </form>
            </section>

            <!-- Expense list -->
            <section class="card">
                <div class="card-head">
                    <h2>Expenses</h2>
                    <div class="card-head-tools">
                        <div id="expense-range"></div>
                    </div>
                </div>

                <div class="summary-row" id="expense-summary"></div>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Details</th>
                                <th>Paid By</th>
                                <th class="num">Amount</th>
                                <th class="actions"></th>
                            </tr>
                        </thead>
                        <tbody id="expense-table-body">
                            <tr><td class="empty" colspan="6">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="footer"></footer>
    </div>

    <script type="module" src="./js/expenses.js"></script>
</body>

</html>
